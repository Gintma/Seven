name: Bug Report
description: Report a bug or unexpected behavior in Seven
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: "e.g. macOS 15.3 (Apple Silicon)"
    validations:
      required: true

  - type: input
    id: seven_version
    attributes:
      label: Seven Version
      placeholder: "e.g. 0.16.6 (71)"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or related settings (please redact any API keys or private text).
